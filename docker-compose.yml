services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  livekit:
    image: livekit/livekit-server
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50010:50000-50010/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
