# Render Blueprint. LiveKit stays on LiveKit Cloud: Render cannot open the UDP range WebRTC needs.
# One web service runs both the table and the poker engine. The engine listens on 127.0.0.1 only
# and takes a per-boot token from scripts/render-start.mjs.
services:
  - type: keyvalue
    name: shulchan-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: shulchan-server
    runtime: node
    plan: free
    buildCommand: npm install --prefix server
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: REDIS_URL
        fromService:
          name: shulchan-redis
          type: keyvalue
          property: connectionString
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
