# Render Blueprint. LiveKit stays on LiveKit Cloud: Render cannot open the UDP range WebRTC needs.
services:
  - type: keyvalue
    name: shulchan-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: shulchan-poker
    runtime: node
    plan: free
    rootDir: poker-engine
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: REDIS_URL
        fromService:
          name: shulchan-redis
          type: keyvalue
          property: connectionString

  - type: web
    name: shulchan-server
    runtime: node
    plan: free
    rootDir: table
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: REDIS_URL
        fromService:
          name: shulchan-redis
          type: keyvalue
          property: connectionString
      - key: POKER_ENGINE_URL
        value: https://shulchan-poker.onrender.com
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
