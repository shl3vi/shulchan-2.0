<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LOOCHKA</title>
  <meta name="description" content="Pull up a chair. A private table for the people you invite.">
  <meta name="theme-color" content="#070912">
  <meta property="og:title" content="LOOCHKA">
  <meta property="og:description" content="Pull up a chair.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23070912'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23f3a66f' stroke-width='1.4'/%3E%3Ccircle cx='16' cy='16' r='2.2' fill='%23f3a66f'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,560;1,9..144,560&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --night: #070912;
      --cream: #f7f2e8;
      --muted: #c9c4d8;
      --apricot: #f3a66f;
      --link: #ffd3ad;
      --lilac: #a8b2ff;
    }

    * { box-sizing: border-box; }

    html { height: 100%; }

    body {
      margin: 0;
      min-height: 100%;
      color: var(--cream);
      background:
        radial-gradient(ellipse at 50% 42%, rgba(92, 77, 216, 0.22), transparent 46%),
        radial-gradient(ellipse at center, #141226 0%, var(--night) 58%, #04050c 100%);
      font-family: Fraunces, Palatino, "Iowan Old Style", serif;
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    body::after {
      content: "";
      position: fixed;
      inset: -20%;
      pointer-events: none;
      opacity: 0.28;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.55'/></svg>");
    }

    .seal {
      position: relative;
      display: grid;
      place-items: center;
      width: 100%;
    }

    .glow, .ring {
      position: absolute;
      left: 50%;
      top: 54%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .glow {
      width: min(92vmin, 760px);
      aspect-ratio: 1;
      background: radial-gradient(circle, rgba(243, 166, 111, 0.2), rgba(243, 166, 111, 0.05) 38%, transparent 68%);
    }

    .ring {
      width: min(74vmin, 620px);
      aspect-ratio: 1;
      border-radius: 50%;
      box-shadow:
        inset 0 0 0 1px rgba(255, 214, 176, 0.5),
        inset 0 0 90px rgba(228, 123, 76, 0.14),
        0 0 90px rgba(243, 166, 111, 0.14);
    }

    .ring::before {
      content: "";
      position: absolute;
      inset: 12%;
      border-radius: 50%;
      box-shadow: inset 0 0 0 1px rgba(255, 214, 176, 0.18);
    }

    @media (prefers-reduced-motion: no-preference) {
      .glow {
        animation: breathe 10s ease-in-out infinite;
      }
    }

    @keyframes breathe {
      50% { opacity: 0.7; transform: translate(-50%, -50%) scale(1.045); }
    }

    a { color: inherit; }

    a:focus-visible {
      outline: 2px solid var(--lilac);
      outline-offset: 4px;
      border-radius: 2px;
    }

    .skip {
      position: absolute;
      left: 1rem;
      top: 0;
      transform: translateY(-120%);
      background: var(--cream);
      color: #1c140e;
      padding: 0.6rem 0.9rem;
      z-index: 2;
    }

    .skip:focus { transform: none; }

    header, footer {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1.25rem;
      padding: 1.7rem 7vw;
    }

    .kicker, header a, footer a {
      font-family: Syne, "Avenir Next", "Segoe UI", sans-serif;
      font-weight: 700;
      text-decoration: none;
    }

    .kicker, header a {
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-size: 0.72rem;
    }

    .kicker {
      margin: 0;
      color: var(--lilac);
    }

    header a { color: var(--cream); }

    header a:hover, footer a:hover { color: var(--link); }

    main {
      position: relative;
      z-index: 1;
      display: grid;
      align-content: center;
      justify-items: center;
      text-align: center;
      padding: 1rem 1.4rem 3rem;
    }

    h1 {
      margin: 0;
      font-family: Syne, "Avenir Next", sans-serif;
      font-weight: 800;
      font-size: clamp(2.7rem, 12.4vw, 8.4rem);
      line-height: 0.86;
      letter-spacing: 0.16em;
      padding-left: 0.16em;
      color: #fffaf3;
      background: linear-gradient(180deg, #fffaf3 18%, #f3d2b4 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .invite {
      margin: 1.15rem 0 0;
      font-size: clamp(1.7rem, 3.6vw, 3rem);
      font-style: italic;
      font-weight: 560;
      letter-spacing: -0.025em;
      color: var(--apricot);
    }

    .deck {
      margin: 0.95rem 0 0;
      max-width: 26rem;
      font-size: 1.18rem;
      font-weight: 560;
      line-height: 1.45;
      color: var(--muted);
    }

    footer {
      align-items: flex-end;
      color: var(--muted);
      font-size: 1.02rem;
      line-height: 1.45;
    }

    footer p { margin: 0; max-width: 22rem; }

    footer a {
      color: var(--link);
      letter-spacing: 0.04em;
      font-size: 0.95rem;
      border-bottom: 1px solid rgba(255, 211, 173, 0.4);
      padding-bottom: 0.15rem;
    }

    ::selection {
      background: var(--apricot);
      color: #1c120c;
    }

    @media (max-width: 720px) {
      header, footer { padding-inline: 1.25rem; }
      h1 { letter-spacing: 0.08em; padding-left: 0.08em; }
      footer {
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding-bottom: 1.6rem;
      }
      footer p { max-width: 18rem; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <header>
    <p class="kicker">A private table</p>
    <a href="/support">Support</a>
  </header>
  <main id="content">
    <div class="seal">
      <div class="glow" aria-hidden="true"></div>
      <div class="ring" aria-hidden="true"></div>
      <h1>LOOCHKA</h1>
    </div>
    <p class="invite">Pull up a chair.</p>
    <p class="deck">Open it. Send the link. Sit down with the people you already know.</p>
  </main>
  <footer>
    <p>Camera and microphone stay off until you turn them on.</p>
    <a href="mailto:support@loochka.com">support@loochka.com</a>
  </footer>
</body>
</html>
